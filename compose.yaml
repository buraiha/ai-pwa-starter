services:
  app:
    build:
      context: .
      dockerfile: Containerfile.dev
    ports:
      - "${PWA_DEV_PORT:-8080}:5173"
    volumes:
      - .:/app:Z
      - node_modules:/app/node_modules
      - app_data:/app/data:U
    environment:
      - CHOKIDAR_USEPOLLING=true

volumes:
  node_modules:
  app_data:
